version: '3.9'

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_in_production}
      - UPLOADS_DIR=/uploads
      - DB_DIR=/data
      - FRONTEND_URL=https://imageshare.6180.co.za
    volumes:
      - /APPBOX_DATA/storage/image-share/uploads:/uploads
      - /APPBOX_DATA/storage/image-share/db_data:/data
    networks:
      - app

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORT:-14586}:80"
    depends_on:
      - backend
    networks:
      - app

volumes:
  uploads:
  db_data:

networks:
  app:
    driver: bridge
